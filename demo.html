<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Horodia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: home with two doors (Employé / Manager); employee time clock full screen; manager back-office with floating sidebar. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#EBF0ED; --line:#DCE3DF; --line-2:#C5CFCA;
  --ink:#101915; --ink-2:#45534C; --ink-3:#74827B;
  --accent:#0A7A5C; --accent-hover:#07684E; --accent-ink:#FFFFFF; --accent-soft:#DAF0E7;
  --badge:#F4B42C;
  --ok:#1C7C44; --ok-soft:#DCF1E3; --warn:#9A5800; --warn-soft:#FBEACB; --bad:#B9302A; --bad-soft:#F8DFDC; --info:#2858AE; --info-soft:#E0E8F8;
  --p1:#E6E1F7; --p1-ink:#4B3A94; --p2:#FBE3D3; --p2-ink:#8A3F10; --p3:#DCEBFA; --p3-ink:#1F4F86; --p4:#DDF2E6; --p4-ink:#1D6A40; --p5:#F6E7F0; --p5-ink:#86305E;
  --shadow:0 1px 2px rgba(16,25,21,.05),0 6px 20px rgba(16,25,21,.06);
  --overlay:rgba(16,25,21,.42);
  --sign:#F6C02E; --sign-edge:#D29A00; --sign-ink:#2A1E00;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:7px; --r:11px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --line:#26322D; --line-2:#34433C;
    --ink:#E6EEEA; --ink-2:#A6B4AD; --ink-3:#77867F;
    --accent:#38C496; --accent-hover:#4FD3A6; --accent-ink:#04241A; --accent-soft:#12372B;
    --badge:#F4B42C;
    --ok:#5BCB85; --ok-soft:#163423; --warn:#F0B24A; --warn-soft:#3A2A0E; --bad:#F2786F; --bad-soft:#3D1A17; --info:#86AEF2; --info-soft:#18284A;
    --p1:#2A2445; --p1-ink:#C4B6F7; --p2:#3D271A; --p2-ink:#F5B98F; --p3:#182E47; --p3-ink:#9CC6F2; --p4:#16362A; --p4-ink:#8FDDB2; --p5:#3A1F30; --p5-ink:#F0A9CF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --line:#26322D; --line-2:#34433C;
  --ink:#E6EEEA; --ink-2:#A6B4AD; --ink-3:#77867F;
  --accent:#38C496; --accent-hover:#4FD3A6; --accent-ink:#04241A; --accent-soft:#12372B;
  --badge:#F4B42C;
  --ok:#5BCB85; --ok-soft:#163423; --warn:#F0B24A; --warn-soft:#3A2A0E; --bad:#F2786F; --bad-soft:#3D1A17; --info:#86AEF2; --info-soft:#18284A;
  --p1:#2A2445; --p1-ink:#C4B6F7; --p2:#3D271A; --p2-ink:#F5B98F; --p3:#182E47; --p3-ink:#9CC6F2; --p4:#16362A; --p4-ink:#8FDDB2; --p5:#3A1F30; --p5-ink:#F0A9CF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700;line-height:1.15}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:.8rem}
.btn.icon{width:38px;padding:0}
.btn.icon.sm{width:30px}
.btn svg{width:16px;height:16px;flex:none}

.chip{display:inline-flex;align-items:center;gap:.35rem;min-height:24px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85;flex:none}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.p1{background:var(--p1);color:var(--p1-ink)} .p2{background:var(--p2);color:var(--p2-ink)} .p3{background:var(--p3);color:var(--p3-ink)} .p4{background:var(--p4);color:var(--p4-ink)} .p5{background:var(--p5);color:var(--p5-ink)}

label.f{display:grid;gap:5px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.inp{height:40px;width:100%;min-width:0;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:.92rem;font-weight:500}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{height:150px;padding:10px;font-family:var(--f-mono);font-size:.76rem;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:.78rem;color:var(--ink-3)}
.err{font-size:.82rem;color:var(--bad);font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:.86rem;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}

.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:1.32rem;letter-spacing:-.02em;color:var(--ink)}
.logo svg{width:30px;height:30px;flex:none}
.logo i{display:inline-block;width:7px;height:7px;background:var(--badge);border-radius:2px;margin-left:2px;transform:translateY(-1px)}
.av{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:.78rem;letter-spacing:.02em}
.av.lg{width:64px;height:64px;border-radius:16px;font-size:1.3rem}
.av svg{width:18px;height:18px}

/* ---------- home ---------- */
.home{max-width:1000px;margin:0 auto;min-height:calc(100vh - 32px);display:grid;grid-template-rows:auto 1fr auto;gap:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar .site{font-weight:600;color:var(--ink-2);font-size:.9rem}
.home-mid{display:grid;align-content:center;gap:36px;padding-block:12px}
.clock{text-align:center}
.clock .time{font-family:var(--f-mono);font-size:clamp(3.4rem,10vw,6.8rem);font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.clock .time span{color:var(--ink-3);font-size:.4em;letter-spacing:0;margin-left:.15em}
.clock .date{font-family:var(--f-display);font-size:1.35rem;font-weight:600;color:var(--ink-2);margin-top:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.choice{display:grid;gap:12px;text-align:left;padding:28px;border-radius:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;align-content:start}
.choice:hover{transform:translateY(-2px);border-color:var(--accent)}
.choice .ci{width:58px;height:58px;border-radius:16px;display:grid;place-items:center}
.choice .ci svg{width:28px;height:28px}
.choice.emp .ci{background:var(--accent);color:var(--accent-ink)}
.choice.mgr .ci{background:var(--ink);color:var(--bg)}
.choice.plan .ci{background:var(--p3);color:var(--p3-ink)}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.home.pub{max-width:1440px}
.repos{font-size:.74rem;color:var(--ink-3);padding:5px 2px}
.dtabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dtabs button{height:58px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.78rem;color:var(--ink-2);display:grid;place-items:center;align-content:center;gap:1px;line-height:1.1}
.dtabs button b{font-family:var(--f-display);font-size:1.2rem;color:var(--ink)}
.dtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dtabs button[aria-pressed="true"] b{color:var(--accent-ink)}
.dtabs button.is-today:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent)}
.slots{display:grid}
.slot{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot.now{background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.slot .when{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem;min-width:136px;white-space:nowrap}
.slot .when span{color:var(--ink-3);margin:0 2px}
.slot .grow{flex:1;min-width:0}
.slot .grow b{font-size:.98rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1000px){ .choices.three{grid-template-columns:1fr} }
@media (max-width:520px){ .slot{flex-wrap:wrap;gap:8px 12px;padding:12px 14px} .slot .when{min-width:0;width:100%} .slot .grow b{white-space:normal} .slot .chip.plain{display:none} .dtabs{gap:4px} .dtabs button{height:52px} }
.choice h2{font-size:1.7rem}
.choice p{color:var(--ink-2);max-width:36ch}
.choice .go{font-weight:700;color:var(--accent);margin-top:4px}
.foot{font-size:.8rem;color:var(--ink-3);text-align:center}
.foot b{font-family:var(--f-mono);color:var(--ink-2)}

/* ---------- kiosk / pin ---------- */
.k-body{display:grid;grid-template-columns:1fr minmax(0,420px);gap:28px;align-items:center}
.k-body .clock{text-align:left}
.k-panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow);display:grid;gap:18px;min-height:470px;align-content:start}
.k-panel h2{font-size:1.3rem}
.dots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.six{gap:10px} .dots.six i{width:15px;height:15px}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:1.6rem;font-weight:600;cursor:pointer;color:var(--ink)}
.pad button:hover{border-color:var(--line-2)}
.pad button:active{transform:scale(.97);background:var(--accent-soft)}
.pad button.fn{font-family:var(--f-body);font-size:.85rem;color:var(--ink-2)}
.k-who{display:flex;gap:14px;align-items:center}
.k-who h2{font-size:1.5rem}
.k-acts{display:grid;gap:10px}
.k-acts .btn{height:64px;font-size:1.1rem;border-radius:14px}
.k-done{display:grid;place-items:center;text-align:center;gap:10px;padding-top:30px}
.k-done .ok{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;animation:pop .25s ease}
.k-done .ok svg{width:42px;height:42px}
.k-done .big{font-family:var(--f-mono);font-size:2.6rem;font-weight:600}
.mgr-panel .ci{width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;margin:0 auto}
.mgr-panel .ci svg{width:24px;height:24px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;max-width:1440px;margin:0 auto;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 12px;display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 32px)}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px}
.space{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r);background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:600}
.space svg{width:16px;height:16px}
.space span{white-space:nowrap}
.space small{margin-left:auto;opacity:.7;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);font-weight:600;font-size:.88rem;cursor:pointer;text-align:left;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.7rem;display:grid;place-items:center;font-family:var(--f-mono)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
.me .who{min-width:0;flex:1}
.me .who b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:.74rem;color:var(--ink-3)}
.main{min-width:0;display:grid;gap:18px;padding-bottom:40px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.page-head .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px;flex-wrap:wrap}
.card-b{padding:0 18px 18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:grid;gap:2px;text-align:left}
button.stat{cursor:pointer;font:inherit;color:inherit}
button.stat:hover{border-color:var(--line-2)}
.stat .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--ink-2);font-weight:600}
.stat.alert{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.stat.alert .v{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow > span{display:block;font-size:.78rem;color:var(--ink-3)}
.row.click{cursor:pointer;border-radius:var(--r-sm)}
.row.click:hover{background:var(--surface-2)}
.empty{padding:18px 0;color:var(--ink-3);font-size:.88rem}
.live{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:1.3rem;font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.76rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:.8rem;color:var(--ink-3);max-width:85ch}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.navgrp{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.navgrp .lbl{padding:0 10px;font-weight:600;font-size:.88rem;white-space:nowrap}
.navgrp .btn{height:32px;border:0}
.wkno{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);margin-left:4px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:.84rem;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem}
.t th{text-align:left;font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t td.n{font-size:.82rem}
.t tfoot td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0;background:var(--surface-2)}
.t .who{display:flex;align-items:center;gap:10px;min-width:170px}
.t .who b{display:block;font-size:.88rem;white-space:nowrap}
.t .who > div > span{display:block;font-size:.74rem;color:var(--ink-3);white-space:nowrap}
.zero{color:var(--ink-3)}
.code{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;letter-spacing:.18em;background:var(--surface-2);padding:3px 10px;border-radius:7px;display:inline-block}
.code.mgr{background:var(--ink);color:var(--bg);font-size:.9rem}

/* planning grid */
.plan-t{min-width:980px}
.plan-t th.day b{display:block;font-family:var(--f-display);font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--ink)}

function genActivity(){
  const R = rng(hashStr(todayKey()+'horodia'));
  const now = Date.now(), curMon = mondayOf(new Date()), E = state.employees;
  const find = (first, idx) => E.find(e => e.first === first) || E[idx];
  const wk = (n, d) => dkey(addDays(curMon, n*7+d));
  const hpd = e => Math.round(e.contract/5*100)/100;
  const abs = [];
  const emma = find('Emma',8), tom = find('Tom',11), mathis = find('Mathis',5), ines = find('Inès',4);
  if (emma) abs.push({id:uid(), emp:emma.id, type:'conge', from:wk(-2,0), to:wk(-2,4), hpd:hpd(emma)});
  if (tom) abs.push({id:uid(), emp:tom.id, type:'maladie', from:wk(-1,1), to:wk(-1,2), hpd:hpd(tom)});
  if (mathis) abs.push({id:uid(), emp:mathis.id, type:'absence', from:wk(-3,5), to:wk(-3,5), hpd:hpd(mathis)});
  if (ines) abs.push({id:uid(), emp:ines.id, type:'conge', from:wk(1,2), to:wk(1,4), hpd:hpd(ines)});
  state.absences = abs; state.shifts = []; state.punches = []; state.validated = {};
  const absOn = (id,k) => abs.some(a => a.emp === id && a.from <= k && k <= a.to);
  for (let w = -6; w <= 1; w++){
    const mon = addDays(curMon, w*7);
    for (const emp of E){
      const C = emp.contract*60;
      const work = emp.role === 'gerant' ? [0,1,2,3,4] : shuffle([0,1,2,3,4,5,6], R).slice(emp.contract >= 30 ? 2 : emp.contract >= 24 ? 3 : 4).sort((a,b)=>a-b);
      let remaining = C;
      work.forEach((d, i) => {
        const k = dkey(addDays(mon, d));
        if (absOn(emp.id, k)) { remaining -= C/work.length; return; }
        const need = remaining/(work.length - i);
        let picks;
        if (emp.role === 'gerant') picks = [R() < .5 ? ['09:00','17:15'] : ['10:00','18:15']];
        else if (emp.poste !== 'Management' && need >= 450) picks = [['11:00','15:00'],['18:30','22:30']];
        else { const pool = POOL[emp.poste] || POOL.default; const sorted = pool.map(p => [p, Math.abs(eff(p)-need)]).sort((a,b)=>a[1]-b[1]); picks = [sorted[R() < .65 ? 0 : 1][0]]; }
        for (const p of picks){ state.shifts.push({id:uid(), emp:emp.id, date:k, start:p[0], end:p[1], poste:emp.poste}); remaining -= eff(p); }
      });
      if (emp.contract >= 35 && emp.role !== 'gerant' && R() < .4){
        const free = [0,1,2,3,4,5,6].filter(d => !work.includes(d));
        if (free.length){ const k = dkey(addDays(mon, free[Math.floor(R()*free.length)])); if (!absOn(emp.id,k)) state.shifts.push({id:uid(), emp:emp.id, date:k, start:'18:00', end:'23:00', poste:emp.poste}); }
      }
    }
  }

    const {s, e} = shiftTimes(sh); if (s > now) continue;
    const late = R() < .08 ? 12 + Math.floor(R()*18) : Math.floor(R()*9) - 7;
    const tin = s + late*60000; if (tin > now) continue;
    const ps = [{type:'in', ts:tin}];
    const D = dur(sh.start, sh.end);
    if (D >= 360){ const bs = s + (Math.floor(D/2) - 15 + Math.floor(R()*30))*60000; const be = bs + (20 + Math.floor(R()*11))*60000; if (bs < now && bs > tin){ ps.push({type:'break_start', ts:bs}); if (be < now) ps.push({type:'break_end', ts:be}); } }
    const tout = e + (Math.floor(R()*14) - 3)*60000; if (tout < now) ps.push({type:'out', ts:tout});
    for (const p of ps) state.punches.push({id:uid(), emp:sh.emp, ts:p.ts, type:p.type, src:'borne'});
  }
  const hugo = find('Hugo',3);
  if (hugo){
    const cand = state.shifts.filter(sh => sh.emp === hugo.id && shiftTimes(sh).e < now - 12*3600e3 && shiftTimes(sh).e > now - 4*86400e3).sort((a,b) => shiftTimes(b).s - shiftTimes(a).s)[0];
    if (cand){ const {e} = shiftTimes(cand); state.punches = state.punches.filter(p => !(p.emp === hugo.id && p.type === 'out' && p.ts >= e - 5*60000 && p.ts <= e + 15*60000)); }
  }
  const live = state.shifts.filter(sh => { const t = shiftTimes(sh); return now - t.s > 11*60000 && now - t.s < 90*60000 && t.e > now; })[0];
  if (live){ const t = shiftTimes(live); state.punches = state.punches.filter(p => !(p.emp === live.emp && p.ts >= t.s - 20*60000 && p.ts <= now)); }
  state.punches.sort((a,b) => a.ts - b.ts);
  state.seedDate = todayKey();
  dataVer++;
  // days already checked by the manager in the past
  const g = E.find(e => e.role === 'gerant') || E[0];
  for (let i = 3; i <= 45; i++){ const k = dkey(addDays(new Date(), -i)); if (!dayBlockers(k).length) state.validated[k] = {by:g ? g.first : 'Manager', ts:atTime(k,'23:40')}; }
}

/* ================= computation ================= */
function C(){
  if (cache.ver === dataVer) return cache;
  const shiftsBy = new Map(), sessBy = new Map(), s2s = new Map(), sessShift = new Map(), pBy = new Map();
  for (const sh of state.shifts){ if (!shiftsBy.has(sh.emp)) shiftsBy.set(sh.emp, []); shiftsBy.get(sh.emp).push(sh); }
  for (const p of state.punches){ if (!pBy.has(p.emp)) pBy.set(p.emp, []); pBy.get(p.emp).push(p); }
  for (const [emp, list] of pBy){
    list.sort((a,b) => a.ts - b.ts);
    const out = []; let cur = null;
    for (const p of list){
      if (p.type === 'in'){ if (cur) out.push(cur); cur = {emp, start:p.ts, end:null, breaks:[], punches:[p], date:dkey(new Date(p.ts))}; }
      else if (!cur) continue;
      else {
        cur.punches.push(p);
        if (p.type === 'break_start') cur.breaks.push({s:p.ts, e:null});
        else if (p.type === 'break_end'){ const b = cur.breaks[cur.breaks.length-1]; if (b && b.e == null) b.e = p.ts; }
        else if (p.type === 'out'){ cur.end = p.ts; out.push(cur); cur = null; }
      }
    }
    if (cur) out.push(cur);
    sessBy.set(emp, out);
    const shs = shiftsBy.get(emp) || [];
    for (const ss of out){
      let best = null, bd = 4*3600e3;
      for (const sh of shs){ const d = Math.abs(shiftTimes(sh).s - ss.start); if (d < bd){ bd = d; best = sh; } }
      if (best){ sessShift.set(ss, best); if (!s2s.has(best.id)) s2s.set(best.id, ss); }
    }
  }
  cache = {ver:dataVer, shiftsBy, sessBy, s2s, sessShift};
  return cache;
}
const sessionsOf = id => C().sessBy.get(id) || [];
const shiftsOf = id => C().shiftsBy.get(id) || [];
const shiftsOn = (id, k) => shiftsOf(id).filter(s => s.date === k).sort((a,b) => a.start.localeCompare(b.start));
const sessionForShift = sh => C().s2s.get(sh.id) || null;
const shiftForSession = ss => C().sessShift.get(ss) || null;
function workIntervals(s, endOverride){
  const end = s.end ?? endOverride; let iv = [[s.start, end]];
  for (const br of s.breaks){ const bs = br.s, be = br.e ?? end; iv = iv.flatMap(([a,b]) => { if (be <= a || bs >= b) return [[a,b]]; const r = []; if (bs > a) r.push([a,bs]); if (be < b) r.push([be,b]); return r; }); }
  return iv;
}
const ivMin = iv => iv.reduce((t,[a,b]) => t + Math.max(0,b-a), 0)/60000;
const breakMin = (s, endOverride) => s.breaks.reduce((t,b) => t + Math.max(0, (b.e ?? s.end ?? endOverride) - b.s), 0)/60000;
function isMissingOut(s){ if (s.end != null) return false; const now = Date.now(); if (now - s.start >= 16*3600e3) return true; const sh = shiftForSession(s); return !!(sh && now > shiftTimes(sh).e + state.company.missDelay*60000); }
const isLive = s => s.end == null && !isMissingOut(s);
function nightOverlap(a, b){
  const c = state.company; let tot = 0; let d = addDays(new Date(a), -1); const last = new Date(b); last.setHours(0,0,0,0);
  const cross = toMin(c.nightEnd) <= toMin(c.nightStart);
  while (d <= last){ const k = dkey(d); const ws = atTime(k, c.nightStart); const we = cross ? atTime(dkey(addDays(d,1)), c.nightEnd) : atTime(k, c.nightEnd); tot += Math.max(0, Math.min(b,we) - Math.max(a,ws)); d = addDays(d,1); }
  return tot/60000;
}
function sundayOverlap(a, b){
  let tot = 0; let d = addDays(new Date(a), 0); const last = new Date(b); last.setHours(0,0,0,0);
  while (d <= last){ if (d.getDay() === 0){ const s = d.getTime(), e = addDays(d,1).getTime(); tot += Math.max(0, Math.min(b,e) - Math.max(a,s)); } d = addDays(d,1); }
  return tot/60000;
}
function weekStats(emp, monKey){
  const c = state.company, mon = parseD(monKey), a0 = mon.getTime(), a1 = addDays(mon,7).getTime();
  let worked = 0, night = 0, sunday = 0, anomalies = 0, late = 0;
  const abs = {conge:0, maladie:0, absence:0};
  for (const s of sessionsOf(emp.id)){
    if (s.start < a0 || s.start >= a1) continue;
    if (s.end == null){ if (isMissingOut(s)) anomalies++; continue; }
    for (const [a,b] of workIntervals(s)){ worked += (b-a)/60000; night += nightOverlap(a,b); sunday += sundayOverlap(a,b); }
    const sh = shiftForSession(s); if (sh && s.start - shiftTimes(sh).s > c.lateTol*60000) late++;
  }
  for (let i = 0; i < 6; i++){ const a = absenceOn(emp.id, dkey(addDays(mon,i))); if (a) abs[a.type] += a.hpd*60; }
  const Cm = emp.contract*60, L = c.legalWeek*60;
  let normal, comp = 0, sup;
  if (Cm < L){ normal = Math.min(worked, Cm); comp = Math.min(Math.max(worked-Cm,0), L-Cm); sup = Math.max(worked-L,0); }
  else { normal = Math.min(worked, L); sup = Math.max(worked-L,0); }
  const sup1 = Math.min(sup, c.sup1Cap*60), sup2 = sup - sup1;
  const r = emp.rate/60;
  const brut = r*(normal + abs.conge) + r*(1+c.compRate/100)*comp + r*(1+c.sup1Rate/100)*sup1 + r*(1+c.sup2Rate/100)*sup2 + r*(c.nightRate/100)*night + r*(c.sundayRate/100)*sunday;
  return {worked, normal, comp, sup1, sup2, night, sunday, conge:abs.conge, maladie:abs.maladie, absence:abs.absence, anomalies, late, brut};
}
const KEYS = ['worked','normal','comp','sup1','sup2','night','sunday','conge','maladie','absence','anomalies','late','brut'];
function sumStats(list){ const o = {}; for (const k of KEYS) o[k] = list.reduce((t,x) => t + x[k], 0); return o; }
function monthWeeks(y, m){ const last = new Date(y, m+1, 0); let mon = mondayOf(new Date(y, m, 1)); const res = []; for (;;){ const sun = addDays(mon,6); if (sun > last) break; if (sun.getMonth() === m) res.push(dkey(mon)); mon = addDays(mon,7); } return res; }
function empPay(emp, weeks){ return sumStats(weeks.map(w => weekStats(emp, w))); }

/* end-of-day report: every person, every punch, every problem */
function dayReport(k){
  const now = Date.now(), tol = state.company.lateTol*60000, rows = [];
  for (const emp of state.employees){
    const shs = shiftsOn(emp.id, k), ss = sessionsOf(emp.id).filter(s => s.date === k), ab = absenceOn(emp.id, k);
    if (!shs.length && !ss.length && !ab) continue;
    const probs = [];
    for (const sh of shs){
      if (ab) break;
      const t = shiftTimes(sh); if (t.s > now) continue;
      const m = sessionForShift(sh);
      if (!m || m.date !== k && !ss.includes(m)){
        if (now < t.e){ if (now - t.s > tol) probs.push({kind:'notyet', lvl:'bad', block:true, text:'Pas encore arrivé'}); }
        else probs.push({kind:'noshow', lvl:'bad', block:true, text:'Aucun pointage'});
        continue;
      }
      const late = m.start - t.s;
      if (late > tol) probs.push({kind:'late', lvl:'warn', block:false, ref:m, text:`Retard de ${Math.round(late/60000)} min`});
      if (m.end){ const early = t.e - m.end; if (early > tol) probs.push({kind:'early', lvl:'warn', block:false, ref:m, text:`Parti ${Math.round(early/60000)} min en avance`}); }
    }
    for (const s of ss){
      if (s.end == null){ if (isMissingOut(s)) probs.push({kind:'missing', lvl:'bad', block:true, text:'Départ non pointé'}); else probs.push({kind:'open', lvl:'info', block:true, text:'En service'}); }
      else if (s.breaks.some(b => b.e == null)) probs.push({kind:'break', lvl:'bad', block:true, text:'Retour de pause non pointé'});
      if (!shiftForSession(s)) probs.push({kind:'unplanned', lvl:'info', block:false, text:'Pointage hors planning'});
    }
    const worked = ss.reduce((t,s) => t + (s.end != null || isLive(s) ? ivMin(workIntervals(s, Date.now())) : 0), 0);
    const planned = shs.reduce((t,s) => t + dur(s.start,s.end), 0);
    rows.push({emp, shs, ss, ab, probs, worked, planned});
  }
  const rank = r => r.probs.some(p => p.lvl === 'bad') ? 0 : r.probs.some(p => p.lvl === 'warn') ? 1 : 2;
  return rows.sort((a,b) => rank(a)-rank(b) || (a.shs[0]?.start||'99').localeCompare(b.shs[0]?.start||'99'));
}
const dayBlockers = k => dayReport(k).flatMap(r => r.probs.filter(p => p.lvl === 'bad').map(p => ({...p, emp:r.emp})));
function dayStatus(k){
  if (k > todayKey()) return {k:'future'};
  const rows = dayReport(k);
  if (!rows.length) return {k:'empty'};
  const bad = rows.reduce((t,r) => t + r.probs.filter(p => p.lvl === 'bad').length, 0);
  const warn = rows.reduce((t,r) => t + r.probs.filter(p => p.lvl === 'warn').length, 0);
  const open = rows.some(r => r.probs.some(p => p.kind === 'open')) || (k === todayKey() && rows.some(r => r.shs.some(s => shiftTimes(s).s > Date.now())));
  if (state.validated[k] && !bad) return {k:'validated', by:state.validated[k], warn};
  if (bad) return {k:'bad', bad, warn};
  if (open) return {k:'live', warn};
  return {k:'ready', warn};
}
function pendingCount(){ let n = 0; for (let i = 0; i < 7; i++){ const k = dkey(addDays(new Date(), -i)); const st = dayStatus(k); if (st.k === 'bad') n += st.bad; } return n; }
function dayChip(st){
  switch (st.k){
    case 'validated': return `<span class="chip ok">Validée</span>`;
    case 'bad': return `<span class="chip bad">${st.bad} oubli${st.bad>1?'s':''} à corriger</span>`;
    case 'live': return `<span class="chip accent">En cours</span>`;
    case 'ready': return `<span class="chip warn">À valider</span>`;
    case 'empty': return `<span class="chip plain">Aucun shift</span>`;
  }
  return '';
}

function empStatus(emp){
  const now = Date.now(), k = todayKey();
  const sess = sessionsOf(emp.id); const last = sess[sess.length-1];
  if (last && isLive(last)){ const lp = last.punches[last.punches.length-1]; return lp.type === 'break_start' ? {k:'pause', since:lp.ts} : {k:'service', since:last.start}; }
  const ab = absenceOn(emp.id, k); if (ab) return {k:'abs', abs:ab};
  for (const sh of shiftsOn(emp.id, k)){
    if (sessionForShift(sh)) continue;
    const t = shiftTimes(sh);
    if (now < t.s) return {k:'attendu', at:t.s, sh};
    if (now < t.e) return {k:'retard', min:Math.round((now-t.s)/60000), sh};
    return {k:'manque', sh};
  }
  const todaySess = sess.filter(s => s.date === k);
  if (todaySess.length || shiftsOn(emp.id,k).length) return {k:'termine', worked:todaySess.reduce((t,s) => t + (s.end ? ivMin(workIntervals(s)) : 0), 0)};
  return null;
}
function statusChip(st){
  const tol = state.company.lateTol;
  switch (st.k){

    case 'pause': return `<span class="chip info">En pause · ${Math.max(1,Math.round((Date.now()-st.since)/60000))} min</span>`;
    case 'attendu': return `<span class="chip">Attendu à ${hm(st.at)}</span>`;
    case 'retard': return st.min > tol ? `<span class="chip bad">Pas pointé · +${st.min} min</span>` : `<span class="chip warn">Arrive · +${st.min} min</span>`;
    case 'manque': return `<span class="chip bad">Absent non signalé</span>`;
    case 'termine': return `<span class="chip plain">Terminé · ${fmtH(st.worked)}</span>`;
    case 'abs': return `<span class="chip ${ABS_CHIP[st.abs.type]}">${ABS_LABEL[st.abs.type]}</span>`;
  }
  return '';
}

function kioskPress(k){

function mgrPress(k){
  mpin.err = '';
  if (k === 'del') mpin.pin = mpin.pin.slice(0,-1); else if (k === 'clr') mpin.pin = ''; else if (mpin.pin.length < 6) mpin.pin += k;

function kioskAction(type){
  const e = empById(kiosk.emp); if (!e) return;
  const ts = Date.now();
  state.punches.push({id:uid(), emp:e.id, ts, type, src:'borne'}); mutate();
  let title, msg = '', warn = '';
  if (type === 'in'){ title = 'Arrivée enregistrée'; msg = `Bon service, ${e.first} !`;
    const all = sessionsOf(e.id), ss = all[all.length-1], sh = ss && shiftForSession(ss);
    if (sh){ const late = Math.round((ts - shiftTimes(sh).s)/60000); if (late > state.company.lateTol) warn = `Retard de ${late} min signalé au manager`; } }
  else if (type === 'break_start'){ title = 'Bonne pause'; msg = 'Pense à pointer ton retour.'; }
  else if (type === 'break_end'){ title = 'Retour de pause enregistré'; msg = 'Bon retour en service.'; }
  else { title = 'Départ enregistré'; const w = sessionsOf(e.id).filter(s => s.date === todayKey() || s.end === ts).reduce((t,s) => t + (s.end != null ? ivMin(workIntervals(s)) : 0), 0); msg = `${fmtH(w)} travaillées aujourd'hui. À bientôt ${e.first} !`; }
  kiosk.emp = null; kiosk.done = {title, msg, warn, ts};
  paint('kPanel', kioskPanel()); idle(4000);
}

  else if (st.k === 'bad') banner = `<div class="banner warn"><span class="bi">${SIGN}</span><div class="grow"><b>${st.bad} pointage${st.bad>1?'s':''} à corriger</b><span>Cliquez sur la ligne concernée pour ajouter l'heure manquante.</span></div></div>`;

  else banner = '';
  const NONE = '<span class="zero">—</span>';
  const tmc = (cls, ts, p) => `<span class="${cls}${p && p.src === 'manager' ? ' mod' : ''}" ${p && p.src === 'manager' ? 'title="Corrigé par un manager"' : ''}>${hm(ts)}</span>`;
  const body = rows.map(r => {
    const errs = r.probs.filter(p => p.kind !== 'open');

    const brk = per(s => { const b = find(s,'break_start'); return b.length ? b.map(p => tmc('', p.ts, p)).join(' · ') : NONE; });
    const ret = per(s => { if (!s.breaks.length) return NONE; const be = find(s,'break_end'); return s.breaks.map((b,i) => b.e ? tmc('', b.e, be[i]) : (s.end || isMissingOut(s)) ? '<span class="w q">?</span>' : '<span class="zero">…</span>').join(' · '); });
    const dep = per(s => s.end ? tmc(earlyS.has(s) ? 'w' : '', s.end, find(s,'out')[0]) : isMissingOut(s) ? '<span class="w q">?</span>' : '<span class="zero">…</span>');
    let state;
    if (errs.length) state = `<span class="msg">${errs.map(p => esc(p.text)).join('<br>')}</span>${SIGN}`;

  }).join('');

    <div class="actions"><div class="navgrp"><button class="btn ghost icon sm" data-act="day" data-d="-1" aria-label="Jour précédent">${ico('left')}</button><input class="inp" type="date" id="day-pick" value="${k}" style="height:32px;border:0;width:auto;background:transparent" aria-label="Date"><button class="btn ghost icon sm" data-act="day" data-d="1" aria-label="Jour suivant">${ico('right')}</button></div><button class="btn sm" data-act="day-today">Aujourd'hui</button></div></div>

/* ================= import ================= */
function splitCSV(text){
  text = text.replace(/^﻿/,'');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const delim = [';','\t',','].map(d => [d, lines[0].split(d).length]).sort((a,b) => b[1]-a[1])[0][0];
  return lines.map(l => { const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++){ const ch = l[i];
      if (q){ if (ch === '"'){ if (l[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === delim){ out.push(cur); cur = ''; } else cur += ch; }
    out.push(cur); return out.map(s => s.trim()); });
}
function parseDateStr(s){ s = String(s).trim(); let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if (m){ let y = +m[3]; if (y < 100) y += 2000; const d = new Date(y, +m[2]-1, +m[1]); if (d.getDate() === +m[1]) return dkey(d); } return null; }
function parseTimeStr(s){ const m = String(s).trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})?$/); if (!m) return null; const h = +m[1], mi = +(m[2]||0); if (h > 24 || mi > 59) return null; return pad(h%24)+':'+pad(mi); }
function matchEmp(name){ const n = norm(name); if (!n) return null;
  let e = state.employees.find(x => norm(x.first+' '+x.last) === n || norm(x.last+' '+x.first) === n); if (e) return e;
  const byFirst = state.employees.filter(x => norm(x.first) === n); return byFirst.length === 1 ? byFirst[0] : null; }
function analyseImport(text){
  const rows = splitCSV(text); if (rows.length < 2) return {err:'Le fichier doit contenir une ligne d\'en-tête et au moins une ligne de planning.'};
  const h = rows[0].map(norm);
  const idx = (...keys) => h.findIndex(x => keys.some(k => x === k || x.includes(k)));
  const col = { full: idx('employe','collaborateur','salarie','nom complet','personne','agent'), first: idx('prenom'), last: h.findIndex(x => x === 'nom' || x === 'nom de famille'), date: idx('date','jour'), start: idx('debut','start','arrivee'), end: idx('fin','end','depart'), poste: idx('poste','fonction','role','service','activite') };
  if (col.date < 0 || col.start < 0 || col.end < 0 || (col.full < 0 && col.first < 0)) return {err:'Colonnes introuvables. Il faut au minimum : Employé (ou Prénom + Nom), Date, Début, Fin.'};
  const out = rows.slice(1).map((r, i) => {
    const name = col.full >= 0 ? r[col.full] : [r[col.first], col.last >= 0 ? r[col.last] : ''].join(' ');
    const emp = matchEmp(name), date = parseDateStr(r[col.date] || ''), start = parseTimeStr(r[col.start] || ''), end = parseTimeStr(r[col.end] || '');
    const pv = col.poste >= 0 ? r[col.poste] : ''; const poste = POSTES.find(p => norm(p) === norm(pv)) || (emp ? emp.poste : '');
    let status = 'ok', msg = '';
    if (!emp){ status = 'skip'; msg = 'Employé inconnu dans Horodia'; }
    else if (!date){ status = 'skip'; msg = 'Date illisible'; }
    else if (!start || !end || start === end){ status = 'skip'; msg = 'Horaire illisible'; }
    return {line:i+2, name:name.trim(), emp, date, start, end, poste, status, msg};
  });
  return {rows:out, ok:out.filter(r => r.status === 'ok').length};
}
function impPreview(){
  if (!imp) return '';
  if (imp.err) return `<div class="banner bad"><span class="bi">${ico('warn',2.2)}</span><div class="grow"><b>Import impossible</b><span>${esc(imp.err)}</span></div></div>`;
  if (imp.done) return `<div class="banner ok"><span class="bi">${ico('check',2.2)}</span><div class="grow"><b>${imp.done} shifts importés</b><span>Ils sont visibles dans le planning.</span></div><button class="btn sm" data-act="see-planning">Voir le planning</button></div>`;

    <div class="tw" style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)"><table class="t" style="min-width:520px"><thead><tr><th>Ligne</th><th>Employé</th><th>Date</th><th>Horaire</th><th></th></tr></thead><tbody>
      ${imp.rows.slice(0,80).map(r => `<tr><td class="n">${r.line}</td><td>${r.emp ? esc(fullName(r.emp)) : esc(r.name)}</td><td>${r.date ? dShort(parseD(r.date)) : '—'}</td><td class="mono" style="font-size:.8rem">${r.start||'?'}–${r.end||'?'}</td><td>${r.status==='ok'?'<span class="chip ok">OK</span>':`<span class="chip warn">${esc(r.msg)}</span>`}</td></tr>`).join('')}
    </tbody></table></div>
    <label class="check"><input type="checkbox" id="imp-replace" checked> Remplacer les shifts déjà prévus sur ces jours pour ces employés</label>
    <button class="btn primary" data-act="imp-run" ${imp.ok?'':'disabled'} style="justify-self:start">Importer ${imp.ok} shift${imp.ok>1?'s':''}</button></div>`;
}
function exampleCSV(){
  const mon = addDays(mondayOf(new Date()), 14), fr = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  const pick = ['Léa Dubois','Hugo Lefèvre','Karim Benali','Chloé Petit','Lucas Fontaine','Julie Bernard'];
  const sl = [['11h00','15h00'],['18h30','23h00'],['10h30','18h30'],['17h00','23h30']];
  const lines = ['Collaborateur;Date;Heure début;Heure fin;Fonction'];
  pick.forEach((n,i) => { for (let d = 0; d < 7; d++){ if ((d + i) % 3 === 0) continue; const s = sl[(d + i) % sl.length]; lines.push(`${n};${fr(addDays(mon,d))};${s[0]};${s[1]};${i===2?'Management':['Caisse','Cuisine','Caisse','Caisse','Cuisine','Drive'][i]}`); } });
  return lines.join('\n');
}
function runImport(){
  if (!imp || !imp.rows) return;
  const ok = imp.rows.filter(r => r.status === 'ok');
  const replace = $('#imp-replace') ? $('#imp-replace').checked : true;
  if (replace){ const keys = new Set(ok.map(r => r.emp.id+'|'+r.date)); state.shifts = state.shifts.filter(s => !keys.has(s.emp+'|'+s.date)); }
  let n = 0;
  for (const r of ok){ if (!replace && state.shifts.some(s => s.emp === r.emp.id && s.date === r.date && s.start === r.start)) continue; state.shifts.push({id:uid(), emp:r.emp.id, date:r.date, start:r.start, end:r.end, poste:r.poste}); n++; }
  const dates = ok.map(r => r.date).sort();
  log('import', `Planning importé : ${n} shifts${dates.length ? ` du ${dShort(parseD(dates[0]))} au ${dShort(parseD(dates[dates.length-1]))}` : ''}`);
  mutate();
  imp = {done:n, first:dates[0]};
  render(); toast(`${n} shifts importés`);
}
function log(kind, label){ const me = empById(mgr); state.syncLog.push({ts:Date.now(), kind, label, by:me ? me.first : 'Manager'}); if (state.syncLog.length > 50) state.syncLog.shift(); }

function getDownloads(){ if (!dlP) dlP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null); return dlP; }
const n2 = v => (Math.round(v*100)/100).toFixed(2).replace('.',',');
const q = v => { v = String(v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
const toCSV = rows => '﻿'+rows.map(r => r.map(q).join(';')).join('\r\n');
function buildExport(fmt){
  const [y,m] = ui.month, weeks = monthWeeks(y,m), c = state.company, per = `${y}-${pad(m+1)}`;
  if (fmt === 'vars'){
    const rows = [['Matricule','Nom','Prénom','Période','Rubrique','Libellé','Quantité','Unité']];
    for (const e of state.employees){ const s = empPay(e, weeks); for (const [k,l,f] of RUBRICS){ if (Math.round(s[f])) rows.push([matStr(e), e.last, e.first, per, c.codes[k], l, n2(s[f]/60), 'H']); } }
    return {name:`horodia_variables-paie_${slug(c.name)}_${per}.csv`, data:toCSV(rows), count:rows.length-1};
  }
  if (fmt === 'recap'){
    const rows = [['Matricule','Nom','Prénom','Poste','Contrat (h/sem)','Taux horaire (€)','Heures travaillées','Heures normales',`Heures comp. +${c.compRate}%`,`Heures sup. +${c.sup1Rate}%`,`Heures sup. +${c.sup2Rate}%`,'Heures de nuit','Heures dimanche','Congés payés (h)','Maladie (h)','Absences non rémunérées (h)','Départs non pointés','Retards','Brut estimé (€)']];
    for (const e of state.employees){ const s = empPay(e, weeks); rows.push([matStr(e), e.last, e.first, e.poste, n2(e.contract), n2(e.rate), ...['worked','normal','comp','sup1','sup2','night','sunday','conge','maladie','absence'].map(k => n2(s[k]/60)), String(s.anomalies), String(s.late), n2(s.brut)]); }
    return {name:`horodia_recap_${slug(c.name)}_${per}.csv`, data:toCSV(rows), count:rows.length-1};
  }
  const a0 = weeks.length ? parseD(weeks[0]).getTime() : 0, a1 = weeks.length ? addDays(parseD(weeks[weeks.length-1]),7).getTime() : 0;
  const rows = [['Matricule','Nom','Prénom','Date','Heure','Type','Source']];
  for (const p of state.punches.filter(p => p.ts >= a0 && p.ts < a1)){ const e = empById(p.emp); if (!e) continue; const d = new Date(p.ts); rows.push([matStr(e), e.last, e.first, `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`, hm(p.ts), PTYPE[p.type], p.src === 'manager' ? 'Correction manager' : 'Borne']); }
  return {name:`horodia_pointages_${slug(c.name)}_${per}.csv`, data:toCSV(rows), count:rows.length-1};
}
async function saveFile(name, data){
  const dl = await getDownloads();
  if (dl){
    try { await dl.save({filename:name, data}); return 'saved'; }
    catch (e){ if (e && e.code === 'declined') return 'declined'; if (e && e.code === 'rate_limited'){ toast('Un fichier attend déjà votre confirmation'); return 'declined'; } }
  } else if (!window.claude) {
    try { const u = URL.createObjectURL(new Blob([data], {type:'text/csv;charset=utf-8'})); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return 'saved'; } catch(_){}
  }
  openModal(`<div><p class="eyebrow">Fichier</p><h2>${esc(name)}</h2></div><p class="muted" style="font-size:.88rem">Le téléchargement n'est pas disponible dans cette vue. Copiez le contenu ci-dessous dans un fichier .csv ou collez-le directement dans Excel.</p><textarea class="inp" id="csv-out" readonly style="height:220px">${esc(data.replace('﻿',''))}</textarea><div class="modal-actions"><button class="btn" data-act="close-modal">Fermer</button><button class="btn primary" data-act="sel-csv">Tout sélectionner</button></div>`, true);
  return 'shown';
}
async function doExport(){
  const ex = buildExport(ui.fmt), [y,m] = ui.month;
  const r = await saveFile(ex.name, ex.data);
  if (r !== 'declined'){ log('export', `${{vars:'Variables de paie',recap:'Récapitulatif mensuel',punch:'Pointages détaillés'}[ui.fmt]} · ${monthName(y,m)} · ${ex.count} lignes`); mutate(); if (view === 'sync') render(); if (r === 'saved') toast('Fichier prêt pour le logiciel de paie'); }
}

let tT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2800); }
function arm(btn, label='Confirmer la suppression'){
  if (btn.dataset.armed) return true;
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('armed'); } }, 4000);
  return false;
}
function lock(msg){ mgr = null; screen = 'home'; mpin = {pin:'', err:''}; closeModal(); render(); window.scrollTo(0,0); if (msg) toast(msg); }

    case 'pweek-today': ui.pubWeek = dkey(mondayOf(new Date())); ui.pubDay = todayKey(); render(); break;
    case 'pmode': ui.pubMode = d.m; render(); break;
    case 'pday': ui.pubDay = d.k; render(); break;
    case 'go-mgr': screen = 'mgr-pin'; mpin = {pin:'', err:''}; render(); break;

    case 'day': ui.day = dkey(addDays(parseD(ui.day), +d.d)); render(); break;

    case 'shiftForm': {
      const id = f.dataset.id, v = {emp:g('emp'), date:g('date'), start:g('start'), end:g('end'), poste:g('poste')};
      if (!v.date || !v.start || !v.end || v.start === v.end){ toast('Vérifiez la date et les horaires'); return; }
      if (id) Object.assign(state.shifts.find(s => s.id === id), v); else state.shifts.push({id:uid(), ...v});
      mutate(); closeModal(); render(); toast(id ? 'Shift modifié' : 'Shift ajouté'); break; }
    case 'punchForm': {
      const emp = f.dataset.emp, k = f.dataset.date, old = new Set(f.dataset.ids.split(',').filter(Boolean));
      const oldMap = new Map(state.punches.filter(p => old.has(p.id)).map(p => [p.type+'@'+p.ts, p]));
      const rows = [...f.querySelectorAll('.prow')].map(r => ({type:r.querySelector('select').value, time:r.querySelector('input').value})).filter(r => r.time);
      let prev = -Infinity, offset = 0; const next = [];
      for (const r of rows){ let ts = atTime(k, r.time) + offset; if (ts < prev){ offset += 86400000; ts += 86400000; } prev = ts; next.push(oldMap.get(r.type+'@'+ts) || {id:uid(), emp, ts, type:r.type, src:'manager'}); }
      const changed = next.length !== old.size || next.some(p => !old.has(p.id));
      state.punches = state.punches.filter(p => !old.has(p.id)).concat(next).sort((a,b) => a.ts - b.ts);
      mutate(); closeModal(); render(); toast(changed ? 'Pointages corrigés' : 'Aucun changement'); break; }
    case 'empForm': {
      const id = f.dataset.id, err = $('#ef-err');
      const v = {first:g('first'), last:g('last'), role:g('role'), poste:g('poste'), contract:+g('contract'), rate:+g('rate'), pin:g('pin'), mpin:g('mpin')};
      if (!isMgrRole(v.role)) v.mpin = '';
      const bad = !v.first || !v.last ? 'Le prénom et le nom sont obligatoires.'
        : !/^\d{4}$/.test(v.pin) ? 'Le code de pointage doit faire 4 chiffres.'
        : state.employees.some(e => e.pin === v.pin && e.id !== id) ? 'Ce code de pointage est déjà utilisé.'
        : isMgrRole(v.role) && !/^\d{6}$/.test(v.mpin) ? 'Un gérant ou manager a besoin d\'un code manager à 6 chiffres.'
        : v.mpin && state.employees.some(e => e.mpin === v.mpin && e.id !== id) ? 'Ce code manager est déjà utilisé.'
        : id === mgr && !isMgrRole(v.role) ? 'Vous ne pouvez pas retirer votre propre accès manager.'
        : !(v.contract > 0) || !(v.rate >= 0) ? 'Vérifiez le contrat et le taux horaire.' : '';
      if (bad){ err.textContent = bad; err.hidden = false; return; }
      if (id) Object.assign(empById(id), v); else state.employees.push({id:'e'+uid(), mat:Math.max(0, ...state.employees.map(e => e.mat||0))+1, ...v});
      mutate(); closeModal(); render(); toast(id ? 'Fiche mise à jour' : `${v.first} a rejoint l'équipe`); break; }
    case 'absForm': {
      const e = empById(g('emp')); let from = g('from'), to = g('to'); if (!e || !from || !to) return; if (to < from) [from,to] = [to,from];
      state.absences.push({id:uid(), emp:e.id, type:g('type'), from, to, hpd:+g('hpd') || Math.round(e.contract/5*100)/100}); mutate(); closeModal(); render(); toast('Absence enregistrée'); break; }
    case 'codesForm': { for (const [k] of RUBRICS){ const v = g(k); if (v) state.company.codes[k] = v; } mutate(); toast('Codes enregistrés'); break; }
    case 'settingsForm': {
      const c = state.company, num = (k, min, max) => { const x = parseFloat(g(k)); return isFinite(x) ? Math.min(max, Math.max(min, x)) : c[k]; };
      Object.assign(c, {name:g('name')||c.name, city:g('city'), sector:g('sector'), ccn:g('ccn'), legalWeek:num('legalWeek',1,48), lateTol:num('lateTol',0,60), missDelay:num('missDelay',5,240), compRate:num('compRate',0,100), sup1Rate:num('sup1Rate',0,200), sup1Cap:num('sup1Cap',0,20), sup2Rate:num('sup2Rate',0,200), sundayRate:num('sundayRate',0,200), nightRate:num('nightRate',0,200), nightStart:g('nightStart')||c.nightStart, nightEnd:g('nightEnd')||c.nightEnd});
      mutate(); render(); toast('Réglages enregistrés'); break; }
  }
});

/* ================= timers ================= */
setInterval(() => { const t = $('#kTime'); if (t){ const n = new Date(); t.innerHTML = `${hm(n)}<span>${pad(n.getSeconds())}</span>`; } }, 1000);
setInterval(() => {
  if (screen === 'planning' && Date.now() - lastAct > 120000){ screen = 'home'; render(); return; }
  if (screen === 'manager' && Date.now() - lastAct > 15*60000){ lock('Espace manager verrouillé après 15 min sans activité'); return; }
  if (screen === 'manager' && !modalOpen && view === 'dashboard') render();
}, 30000);

/* ================= boot ================= */
function boot(){
  const s = load();
  if (s && s.v === 2 && Array.isArray(s.employees)){ state = s; state.validated = state.validated || {}; state.syncLog = state.syncLog || []; state.company.codes = Object.assign(defaultCompany().codes, state.company.codes||{}); if (state.seedDate !== todayKey()) genActivity(); }
  else { state = freshState(); genActivity(); }
  save();
  const now = new Date();
  ui.week = dkey(mondayOf(now)); ui.day = todayKey(); ui.month = [now.getFullYear(), now.getMonth()];
  resetKiosk(); render();
}
boot();
})();
</script>
